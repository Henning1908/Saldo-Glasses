<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#07111f">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="Saldo Finanzübersicht für Meta Display Glasses.">
  <title>Saldo · Meta Display Apps</title>
  <link rel="icon" href="/images/saldo-app-icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#07111f;color:#f5f9ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 10%,#163a5a,transparent 45%),#07111f}main{min-height:100vh;width:min(100%,600px);margin:auto;padding:28px;display:grid;align-content:center;gap:16px}.eyebrow{color:#66d8ff;font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.brand-kicker{display:flex;align-items:center;gap:10px}.brand-kicker img{width:38px;height:38px;object-fit:contain}h1,p{margin:0}h1{font-size:clamp(2rem,8vw,4rem);line-height:.98;letter-spacing:-.045em}.instruction{color:#c1cfdd;font-size:clamp(1rem,3.5vw,1.2rem);line-height:1.55}.code{font-size:clamp(3rem,16vw,6.3rem);letter-spacing:.11em;font-weight:850;color:#66d8ff;white-space:nowrap}.muted{color:#aab9cf}.summary{display:grid;gap:4px;border:1px solid #34516a;border-radius:18px;padding:18px;background:rgba(8,24,43,.88)}.summary-label{color:#9bb0c5;font-size:.72rem;font-weight:800;letter-spacing:.15em}.summary-total{font-size:clamp(2.7rem,12vw,4.3rem);font-weight:750;letter-spacing:-.05em}.summary-month{color:#aab9cf}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid #30445e;color:#b7c8d8}.row b{color:#f5f9ff;font-size:1.05rem}.latest{border:1px solid #30445e;border-radius:18px;padding:17px;background:rgba(8,24,43,.8)}.latest-label{display:block;color:#66d8ff;font-size:.68rem;font-weight:800;letter-spacing:.14em;margin-bottom:8px}.latest-name{font-weight:700}.latest-meta{margin-top:5px;color:#aab9cf;font-size:.88rem}.hint{color:#8298ad;font-size:.78rem}.hidden{display:none!important}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow brand-kicker"><img src="/images/meta-display-apps-logo.svg" alt="Meta Display Apps"><span>META DISPLAY APPS · SALDO</span></div>
    <h1 id="glass-title">Mit PC verbinden</h1>
    <p id="instruction" class="instruction">Gib diesen Code in Saldo auf deinem Computer ein.</p>
    <div id="code" class="code">------</div>
    <p id="status" class="muted">Verbindung wird vorbereitet …</p>
    <section id="summary" class="summary hidden">
      <span class="summary-label">MONATSERGEBNIS</span>
      <strong id="month-total" class="summary-total">0,00&nbsp;€</strong>
      <span id="month-name" class="summary-month"></span>
      <div class="row"><span>Einnahmen</span><b id="income">0,00&nbsp;€</b></div>
      <div class="row"><span>Ausgaben</span><b id="expense">0,00&nbsp;€</b></div>
    </section>
    <section id="latest" class="latest hidden"><span class="latest-label">LETZTE BUCHUNG</span><div id="latest-name" class="latest-name"></div><div id="latest-meta" class="latest-meta"></div></section>
    <p id="hint" class="hint">Wische nach links oder rechts für weitere Ansichten.</p>
  </main>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const amount = (value) => new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(value);
      let page = 0;
      let profile = null;
      let pairTimer = null;
      const showCode = (code) => {
        $('glass-title').textContent = 'Mit PC verbinden';
        $('instruction').textContent = 'Gib diesen Code in Saldo auf deinem Computer ein.';
        $('code').textContent = `${code.slice(0,3)} ${code.slice(3)}`;
        $('status').textContent = 'Der Code ist 10 Minuten gültig.';
        $('summary').classList.add('hidden'); $('latest').classList.add('hidden'); $('hint').classList.add('hidden');
        pairTimer = setInterval(checkPair, 2500);
      };
      const showData = () => {
        if (!profile) return;
        const tx = profile.transactions || [];
        const now = new Date();
        const monthTx = tx.filter((item) => { const date = new Date(item.date); return date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear(); });
        const income = monthTx.filter((item) => item.type === 'income').reduce((sum, item) => sum + Number(item.amount), 0);
        const expense = monthTx.filter((item) => item.type === 'expense').reduce((sum, item) => sum + Number(item.amount), 0);
        const recent = [...tx].sort((a,b) => new Date(b.date) - new Date(a.date))[0];
        $('glass-title').textContent = page === 1 ? 'Letzte Buchung' : 'Finanzübersicht';
        $('instruction').textContent = '';
        $('code').classList.add('hidden'); $('status').textContent = 'Verbunden · wird automatisch aktualisiert';
        $('summary').classList.toggle('hidden', page !== 0); $('latest').classList.toggle('hidden', page !== 1);
        $('month-total').textContent = amount(income - expense);
        $('month-name').textContent = new Intl.DateTimeFormat('de-DE', { month:'long', year:'numeric' }).format(now);
        $('income').textContent = amount(income); $('expense').textContent = amount(expense);
        if (recent) {
          $('latest-name').textContent = recent.note || recent.category;
          $('latest-meta').textContent = `${recent.type === 'income' ? '+' : '−'}${amount(recent.amount)} · ${recent.category}`;
        } else {
          $('latest-name').textContent = 'Noch keine Buchungen';
          $('latest-meta').textContent = 'Deine erste Buchung erscheint hier.';
        }
        $('hint').classList.remove('hidden');
      };
      async function loadState() {
        const response = await fetch('/api/glasses/state');
        if (!response.ok) return;
        profile = await response.json(); clearInterval(pairTimer); showData();
      }
      async function checkPair() {
        const response = await fetch('/api/glasses/pair-status'); const state = await response.json();
        if (state.connected) await loadState();
        else if (state.expired) { clearInterval(pairTimer); await startPair(); }
      }
      async function startPair() {
        const response = await fetch('/api/glasses/pair', { method:'POST' }); const result = await response.json();
        if (result.connected) { await loadState(); return; }
        showCode(result.code);
      }
      let startX = null;
      document.addEventListener('touchstart', (event) => { startX = event.touches[0].clientX; }, { passive:true });
      document.addEventListener('touchend', (event) => {
        if (startX === null || !profile) return;
        const delta = event.changedTouches[0].clientX - startX;
        if (Math.abs(delta) > 40) { page = delta < 0 ? 1 : 0; showData(); }
        startX = null;
      }, { passive:true });
      document.addEventListener('keydown', (event) => {
        if (!profile || !['ArrowRight','ArrowLeft'].includes(event.key)) return;
        page = event.key === 'ArrowRight' ? 1 : 0; showData();
      });
      startPair();
      setInterval(() => { if (profile) loadState(); }, 20000);
    })();
  </script>
</body>
</html>
